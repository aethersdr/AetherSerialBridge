name: Docs shots

# v1.1 WS-19 (INV-135, decision 11): renders the documentation images from the demo fixture (docs/images/demo/) on
# the platforms the docs describe, natively: the Windows window and TUI on windows-latest, the Linux x64 window and TUI
# in the build container (offscreen), and the Raspberry Pi TUI (the distribution's Qt in an ubuntu:24.04 container on
# a hosted arm64 runner; ci.yml's arm64 switch, ASB_ARM64_RUNNERS, turns it off). Each job runs tools/docs_shots.py
# (it refuses any other fixture and isolates the settings) and uploads docs-shots-<os>: <name>.png + <name>.json
# pairs. Nothing is committed here: a person looks at every image, then commits them under docs/images/<os>/;
# tools/check_docs_images.py (static-checks) gates them.
#
# Run: gh workflow run docs-shots.yml --ref <branch>
#
# Same rules as ci.yml (its header): hosted runners, `contents: read`, actions pinned by SHA; tools/check_qt_pin.py
# checks this file too and requires workflow_dispatch as its only trigger.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Qt pin, as ci.yml spells it (tools/check_qt_pin.py compares ci.yml with cmake/qt-pin.env).
env:
  QT_VERSION: '6.12.0'
  QT_PACKAGE_REVISION: '202609280346'
  AQTINSTALL_VERSION: '3.3.0'
  AQTINSTALL_GIT_REF: '076e1659807d0b362a3ed684d54c2e9c775eb9c7'
  PILLOW_VERSION: '11.0.0'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_ARCH: 'win64_msvc2022_64'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # The pinned Qt: the Actions cache entry ci.yml's windows leg keeps (same path, same key). This job only reads it,
      # behind the same revision evidence check; it installs nothing (run ci.yml on main first if the entry is gone).
      - name: Qt location (the path ci.yml's windows leg caches)
        shell: pwsh
        run: |
          "QT_ROOT=$env:RUNNER_WORKSPACE\Qt" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore Qt (the windows leg's cache entry)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_PACKAGE_REVISION }}-windows-${{ env.QT_ARCH }}-aqt${{ env.AQTINSTALL_GIT_REF }}-sp-rv1
          fail-on-cache-miss: true

      - name: Qt environment (revision evidence checked)
        shell: pwsh
        run: |
          $root = $env:QT_ROOT
          python ci/scripts/check_qt_revision.py evidence `
            --file "$root\.installed-$env:QT_VERSION-$env:QT_PACKAGE_REVISION-$env:QT_ARCH.txt" `
            --version $env:QT_VERSION --revision $env:QT_PACKAGE_REVISION
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $qtRoot = "$root\$env:QT_VERSION\" + ($env:QT_ARCH -replace '^win64_', '')
          "CMAKE_PREFIX_PATH=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$qtRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Build the two test executables
        run: |
          cmake --preset windows-dev
          cmake --build --preset windows-dev --target tst_BridgeWindow tst_Tui

      - name: Render the images
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\shots-venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\shots-venv\Scripts\pip.exe" install -q "Pillow==$env:PILLOW_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ASB_DOCS_FONT_CACHE = "$env:RUNNER_TEMP\asb-docs-fonts"
          & "$env:RUNNER_TEMP\shots-venv\Scripts\python.exe" tools/docs_shots.py --os windows `
            --bin build\windows-dev\bin --out "$env:RUNNER_TEMP\docs-shots-windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-shots-windows
          path: ${{ runner.temp }}/docs-shots-windows
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Qt cache location
        run: echo "QT_CACHE=$RUNNER_TEMP/qt-cache" >> "$GITHUB_ENV"

      # The containers leg's cache entry (same key): aqt's Qt, checked by install-qt.sh's revision evidence.
      - name: Restore Qt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.QT_CACHE }}
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_PACKAGE_REVISION }}-linux-gcc_64-aqt${{ env.AQTINSTALL_VERSION }}-sp-rv1

      - name: Build the build container
        run: >-
          docker build --pull --label org.aethersdr.asb-ci=docs-shots -t asb-build-2204
          -f ci/containers/build-ubuntu2204.Dockerfile ci/containers

      # The window offscreen, the TUI, the generator's own tests, in the build container as the runner's user.
      - name: Build and render in the container
        run: |
          mkdir -p "$QT_CACHE" build-shots home docs-shots-linux
          docker run --rm --label org.aethersdr.asb-ci=docs-shots \
            -u "$(id -u):$(id -g)" -e HOME=/work/home \
            -e ASB_DOCS_FONT_CACHE=/work/home/fonts -e PILLOW_VERSION \
            -v "$PWD:/src" -v "$PWD/build-shots:/build" -v "$PWD/home:/work/home" -v "$PWD/docs-shots-linux:/out" \
            -v "$QT_CACHE:/qt" -w /src asb-build-2204 bash -euxo pipefail -c '
              ci/scripts/install-qt.sh /qt linux_gcc_64
              cmake -S /src -B /build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DASB_BUILD_GUI=ON -DASB_BUILD_TESTS=ON -DASB_WERROR=ON \
                -DASB_REQUIRE_PINNED_QT=ON -DCMAKE_PREFIX_PATH=/qt/'"$QT_VERSION"'/gcc_64
              cmake --build /build --target tst_BridgeWindow tst_Tui
              python3 -m venv /work/home/venv
              /work/home/venv/bin/pip install -q "Pillow==$PILLOW_VERSION"
              /work/home/venv/bin/python -m unittest tools/test_docs_shots.py tools/test_check_docs_images.py
              /work/home/venv/bin/python tools/docs_shots.py --os linux --bin /build/bin --out /out
            '

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-shots-linux
          path: docs-shots-linux
          if-no-files-found: error

  pi:
    # The Raspberry Pi TUI: built against the distribution's Qt in an ubuntu:24.04 container on a hosted arm64 runner,
    # rendered there. The arm64 switch (ci.yml's header) turns it off.
    runs-on: ubuntu-24.04-arm
    if: vars.ASB_ARM64_RUNNERS != 'false'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build and render the TUI in the container
        run: |
          mkdir -p docs-shots-pi
          docker run --rm --label org.aethersdr.asb-ci=docs-shots \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -e PILLOW_VERSION \
            -v "$PWD:/src:ro" -v "$PWD/docs-shots-pi:/out" ubuntu:24.04 bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -q
              apt-get install -y -q --no-install-recommends cmake ninja-build g++ git ca-certificates \
                qt6-base-dev qt6-serialport-dev libdbus-1-dev libgl1-mesa-dev python3 python3-venv
              groupadd -o -g "$HOST_GID" shots && useradd -o -m -u "$HOST_UID" -g "$HOST_GID" shots
              cp -a /src /home/shots/src && chown -R shots: /home/shots/src /out
              runuser -u shots -- env PILLOW_VERSION="$PILLOW_VERSION" bash -euxo pipefail -c "
                cd /home/shots/src
                cmake --preset linux-distro-headless
                cmake --build --preset linux-distro-headless --target tst_Tui
                python3 -m venv /home/shots/venv
                /home/shots/venv/bin/pip install -q Pillow==\$PILLOW_VERSION
                /home/shots/venv/bin/python tools/docs_shots.py --os pi --bin build/linux-distro-headless/bin --out /out"
            '

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-shots-pi
          path: docs-shots-pi
          if-no-files-found: error
